name: Backup database

on:
  schedule:
    - cron: "30 19 * * *" # 02:30 giờ Việt Nam mỗi ngày
  workflow_dispatch:

permissions: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump and encrypt
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          # pg_dump bản 17 tương thích ngược với Postgres cũ hơn của Supabase
          docker run --rm postgres:17 pg_dump --no-owner --no-privileges --schema=public "$BACKUP_DATABASE_URL" \
            | gzip -9 \
            | gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 \
            -o "backup-$(date -u +%Y%m%d).sql.gz.gpg"
          ls -l backup-*.gpg
          test "$(stat -c%s backup-*.gpg)" -gt 1024

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backup-*.gpg
          retention-days: 14
          if-no-files-found: error
